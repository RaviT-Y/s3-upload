# ARMOR S3 upload: skeleton.
#
# One job on the AWS runner. The steps share the machine, so files pass from step to step in work/:
#   1. download   downloads the ARMOR artifacts created in the lookback window (30 hours)   (implemented)
#   2. verify     PLACEHOLDER: verify them and leave the result in work/verified
#   3. upload     the real part: plain `aws s3 cp` of what was verified
#
# Every step runs where the runner's instance role (the S3 access) is reachable, so the download and
# verify steps must treat the zips as untrusted. The runner needs the `gh` CLI and `jq`.
#
# What the download step leaves behind (work/downloads):
#
#   downloads.tsv   one line per downloaded zip:  repo <TAB> run_id <TAB> kind <TAB> artifact_id <TAB> created_at <TAB> head_sha <TAB> zip
#   skipped.tsv     one line per artifact that could not be downloaded:  repo <TAB> run_id <TAB> kind <TAB> reason
#   <owner>__<repo>__<run_id>/<kind>.zip   the untrusted zips (kind: api | abi)
#
# What the verify step has to leave behind:
#
#   work/verified/to_upload.tsv   one line per verified artifact:   <kind> <TAB> <folder> <TAB> <s3-prefix>
#       kind       api | abi
#       folder     where the verified files are, relative to work/verified
#                  (api: the report folder, abi: a folder holding abi_metadata.json)
#       s3-prefix  e.g. 2026/11/20/10/github.com/<owner>/<repo>/<pr>/merge/<run_id>
#                  Build it from GitHub run information only, never from artifact content.
#   work/verified/<folder>/...    the verified files
#
# Example line:
#   api<TAB>qualcomm__fastrpc__123/api<TAB>2026/11/20/10/github.com/qualcomm/fastrpc/42/merge/123

name: ARMOR S3 Upload

on:
  schedule:
    - cron: "17 3 * * *"          # once a day, 03:17 UTC
  workflow_dispatch:
    inputs:
      lookback-hours:
        description: "Hours to look back for ARMOR artifacts. Default 30 = the daily gap plus 6 hours for a late run. Raise it to catch up after a missed day (max 2160)."
        required: false
        default: "30"

permissions: {}

concurrency:
  group: s3-upload
  cancel-in-progress: false

jobs:
  publish:
    name: Download, verify and upload
    # Only the default branch may run this workflow: the job holds the S3 access.
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    # AWS self-hosted runner: its instance role provides the S3 access.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      S3_BUCKET: qli-prd-armor-gh-artifacts
    steps:
      - name: Checkout (for repos.txt)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Self-hosted runners keep their folders between runs: never reuse an old work folder.
      - name: Start with an empty work folder
        run: rm -rf work

      - name: Download ARMOR artifacts
        env:
          # The workflow's own token is tried first; set the secret ARMOR_READ_TOKEN only if it cannot
          # read the other repos' artifacts.
          GH_TOKEN: ${{ secrets.ARMOR_READ_TOKEN || github.token }}
          LOOKBACK_HOURS: ${{ inputs.lookback-hours || '30' }}
        run: |
          set -uo pipefail
          verbose=1        # testing: print every detail. Set to 0 for a short log.
          # The run is daily, so the window is longer than 24 hours: a late or skipped schedule must not
          # leave a gap. The overlap means an artifact can show up in two runs (see the verify step).
          lookback_hours="${LOOKBACK_HOURS:-30}"
          if ! [[ $lookback_hours =~ ^[0-9]{1,4}$ ]] || (( lookback_hours < 1 || lookback_hours > 2160 )); then
            echo "::error::lookback-hours must be a number between 1 and 2160"
            exit 1
          fi
          max_zip=$((100 * 1024 * 1024))
          cutoff="$(date -u -d "$lookback_hours hours ago" +%Y-%m-%dT%H:%M:%SZ)"
          out=work/downloads
          mkdir -p "$out"
          : > "$out/downloads.tsv"
          : > "$out/skipped.tsv"
          list="$(mktemp)"
          raw="$(mktemp)"

          # skip <repo> <run_id> <kind> <reason>
          skip() { printf '%s\t%s\t%s\t%s\n' "$1" "$2" "$3" "$4" >> "$out/skipped.tsv"; echo "::warning::$1 run $2 $3 skipped ($4)"; }

          # Testing helpers (used when verbose=1)
          run_info() {   # what the verify step will need to know about a run
            gh api "/repos/$1/actions/runs/$2" < /dev/null --jq '"      run: status=\(.status) conclusion=\(.conclusion) event=\(.event) branch=\(.head_branch) attempt=\(.run_attempt) workflow=\(.path) calls=\([.referenced_workflows[]?.path] | join(","))"' 2>&1 \
              || echo "      run: could not read run $2"
          }
          list_zip() {   # the entries of a zip: names are escaped, nothing is extracted
            command -v python3 > /dev/null || { echo "      (python3 is not installed: cannot list the zip)"; return; }
            python3 - "$1" <<'PY'
          import sys, zipfile
          try:
              with zipfile.ZipFile(sys.argv[1]) as z:
                  infos = z.infolist()
                  print("      zip entries: %d" % len(infos))
                  for i in infos[:100]:
                      print("      %10d  %s  %s" % (i.file_size, oct(i.external_attr >> 16), ascii(i.filename)))
                  if len(infos) > 100:
                      print("      ... and %d more" % (len(infos) - 100))
          except Exception as exc:
              print("      not a readable zip: " + type(exc).__name__)
          PY
          }

          mapfile -t repos < <(sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' repos.txt | grep -v '^$')
          if (( ${#repos[@]} == 0 )); then
            echo "::error::repos.txt lists no repositories"
            exit 1
          fi

          if (( verbose )); then
            echo "== settings"
            echo "   lookback:   $lookback_hours hours (artifacts created after $cutoff)"
            echo "   size limit: $max_zip bytes per zip"
            echo "   runner:     $(uname -sm), $(gh --version | head -1), $(jq --version), $(python3 --version 2>&1)"
            echo "   rate limit: $(gh api /rate_limit --jq '.resources.core | "\(.remaining) of \(.limit) requests left"' 2>&1)"
            echo "   repos (${#repos[@]}): ${repos[*]}"
          fi

          for repo in "${repos[@]}"; do
            echo "== $repo"
            # repos.txt lists owner/repo
            if ! [[ $repo =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && ${repo#*/} != . && ${repo#*/} != .. ]]; then
              skip "$repo" - - invalid-repo-name
              continue
            fi
            for name in apichecker-reports abichecker-reports; do
              kind="${name%checker-reports}"                    # api / abi
              echo "-- $name"

              # List: gh api "/repos/<repo>/actions/artifacts?name=<name>"
              if ! gh api --paginate "/repos/$repo/actions/artifacts?name=$name&per_page=100" > "$raw"; then
                skip "$repo" - "$kind" listing-failed
                continue
              fi
              if (( verbose )); then
                echo "   $(jq -s -r '.[0].total_count' "$raw") artifact(s) with this name in the repo; what happens to each (newest first, first 100):"
                jq -r --arg name "$name" --arg cutoff "$cutoff" '
                    .artifacts[]
                    | "     artifact \(.id)  run \(.workflow_run.id)  created \(.created_at)  \(.size_in_bytes) bytes  ->  "
                      + (if .name != $name then "ignored (other name)" elif .expired then "ignored (expired)"
                         elif .created_at < $cutoff then "ignored (older than the window)" else "in the window" end)' "$raw" | head -n 100
              fi

              # Keep what is not expired and was created inside the lookback window, newest artifact per run.
              if ! jq -r --arg name "$name" --arg cutoff "$cutoff" '
                       .artifacts[]
                       | select(.name == $name and (.expired | not) and .created_at >= $cutoff)
                       | [.workflow_run.id, .id, .created_at, (.workflow_run.head_sha // "-"), .size_in_bytes] | @tsv' "$raw" \
                   | sort -t $'\t' -k1,1n -k3,3r | awk -F '\t' '!seen[$1]++' > "$list"; then
                skip "$repo" - "$kind" listing-failed
                continue
              fi
              (( verbose )) && echo "   to download (newest per run): $(wc -l < "$list")"

              while IFS=$'\t' read -r run_id art_id created head_sha size; do
                echo "   run $run_id: artifact $art_id, created $created, $size bytes, commit ${head_sha:0:12}"
                (( verbose )) && run_info "$repo" "$run_id"
                if ! [[ $run_id =~ ^[0-9]+$ && $art_id =~ ^[0-9]+$ && $size =~ ^[0-9]+$ ]]; then
                  skip "$repo" "$run_id" "$kind" unexpected-data
                  continue
                fi
                if (( size > max_zip )); then
                  skip "$repo" "$run_id" "$kind" too-large
                  continue
                fi

                # Download: gh api "/repos/<repo>/actions/artifacts/<id>/zip" > <kind>.zip
                zip="$out/${repo//\//__}__$run_id/$kind.zip"
                mkdir -p "$(dirname "$zip")"
                if gh api "/repos/$repo/actions/artifacts/$art_id/zip" < /dev/null > "$zip"; then
                  printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$repo" "$run_id" "$kind" "$art_id" "$created" "$head_sha" "$zip" >> "$out/downloads.tsv"
                  echo "      downloaded to $zip"
                  if (( verbose )); then
                    echo "      $(stat -c %s "$zip") bytes, sha256 $(sha256sum "$zip" | cut -d' ' -f1)"
                    list_zip "$zip"
                  fi
                else
                  rm -f "$zip"
                  skip "$repo" "$run_id" "$kind" download-failed
                fi
              done < "$list"
            done
          done

          echo "Downloaded $(wc -l < "$out/downloads.tsv") artifact(s), skipped $(wc -l < "$out/skipped.tsv")"
          if (( verbose )); then
            echo
            echo "=== downloads.tsv: repo, run_id, kind, artifact_id, created_at, head_sha, zip"
            cat "$out/downloads.tsv"
            echo "=== skipped.tsv: repo, run_id, kind, reason"
            cat "$out/skipped.tsv"
            echo "=== files on disk"
            find "$out" -type f -printf '   %8s bytes  %p\n'
          fi

      # - name: Verify artifacts (placeholder)
      #   run: |
      #     # TODO: for every zip in work/downloads/downloads.tsv: check the run (finished, an ARMOR run, not
      #     # uploaded before: the lookback window overlaps the previous run's by about 6 hours, so the same
      #     # run can arrive twice) and the zip (file types, executables, symlinks, unsafe paths, sizes, JSON,
      #     # metadata against the run). Ignore an artifact that fails and carry on with the next one; fail
      #     # the run in a last step if any artifact was ignored or skipped (work/downloads/skipped.tsv).
      #     # Put what passed under work/verified/<folder>/ and add one line per artifact to
      #     # work/verified/to_upload.tsv.
      #     mkdir -p work/verified
      #     printf '# kind\tfolder\ts3-prefix\n' > work/verified/to_upload.tsv
      #     echo "TODO: verify the artifacts"

      # - name: Upload to S3
      #   run: |
      #     set -uo pipefail
      #     failed=0
